name: Build Android app

# Builds a thin Android wrapper (Capacitor) that opens the live PTPN site. The web app updates itself,
# so this only needs to run when the wrapper changes (icon, name, address). Run it from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android.yml', 'public/favicon.svg']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run add
      - run: npx cap sync android
      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PTPN.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: PTPN for Android
          body: |
            Download PTPN.apk on an Android phone and open it to install.
            The app loads the live PTPN site, so you do not need a new file when the app changes.
          files: mobile/PTPN.apk
          make_latest: false
